<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2130" role="img" aria-labelledby="title desc"><title id="title">Namma Veedu: idea, implementation, options, results and Mira learning</title><desc id="desc">Connected product lifecycle from the original idea to customer choices, evidence-based outcomes, shared Supabase records, owner reports, draft learning, owner approval, regression testing and release.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#18334D"/></marker></defs><rect width="1200" height="2130" rx="24" fill="#D9D3C7"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#18334D;text-anchor:middle;font-size:16px}.edge{fill:none;stroke:#18334D;stroke-width:2;marker-end:url(#arrow)}.node{fill:#F5F2EA;stroke:#18334D;stroke-width:1.5}.heading{font-weight:700;fill:#18334D} .node{stroke:#18334D} #idea .node,#learning .node{stroke:#B89750;stroke-width:3}</style><text x="600" y="36" style="font-size:24px;font-weight:700">Namma Veedu · Complete product and learning blueprint</text><path class="edge" d="M600.0 180V207.5H600.0V235"/><path class="edge" d="M600.0 335V362.5H600.0V390"/><path class="edge" d="M600.0 480V507.5H600.0V535"/><path class="edge" d="M600.0 645V677.5H230.0V710"/><path class="edge" d="M600.0 645V677.5H600.0V710"/><path class="edge" d="M600.0 645V677.5H970.0V710"/><path class="edge" d="M230.0 820V855.0H230.0V890"/><path class="edge" d="M600.0 820V855.0H600.0V890"/><path class="edge" d="M970.0 820V855.0H970.0V890"/><path class="edge" d="M230.0 1010V1045.0H600.0V1080"/><path class="edge" d="M600.0 1010V1045.0H600.0V1080"/><path class="edge" d="M970.0 1010V1045.0H600.0V1080"/><path class="edge" d="M600.0 1190V1220.0H600.0V1250"/><path class="edge" d="M600.0 1360V1390.0H600.0V1420"/><path class="edge" d="M600.0 1520V1550.0H600.0V1580"/><path class="edge" d="M600.0 1670V1705.0H230.0V1740"/><path class="edge" d="M600.0 1670V1705.0H600.0V1740"/><path class="edge" d="M600.0 1670V1705.0H970.0V1740"/><path class="edge" d="M600.0 1840V1875.0H600.0V1910"/><path class="edge" d="M970.0 1840V1875.0H600.0V1910"/><path class="edge" d="M65 1790H30V1625H300"/><path class="edge" d="M300 1960H12V285H300"/><text x="600" y="2055">Measure outcomes → review evidence → improve → verify again</text><text x="600" y="2090" style="font-size:14px">Email delivery needs SMTP + worker; in-app reminders need an active browser. Updated 10 October 2026.</text><g id="idea"><rect class="node" x="300" y="80" width="600" height="100" rx="12"/><text x="600.0" y="115.5" class="heading">IDEA · Namma Veedu</text><text x="600.0" y="136.5" class="">Understand property needs in English or Tamil</text><text x="600.0" y="157.5" class="">Useful shortlist, clear next step, owner visibility</text></g><g id="build"><rect class="node" x="300" y="235" width="600" height="100" rx="12"/><text x="600.0" y="270.5" class="heading">IMPLEMENTATION</text><text x="600.0" y="291.5" class="">Streamlit + Mira conversation engine + safe tools</text><text x="600.0" y="312.5" class="">Saved catalogue + hosted reasoning when configured</text></g><g id="welcome"><rect class="node" x="300" y="390" width="600" height="90" rx="12"/><text x="600.0" y="420.5" class="heading">CUSTOMER ENTRY</text><text x="600.0" y="441.5" class="">Welcome · English / Tamil · feedback invitation</text><text x="600.0" y="462.5" class="">Chat, quick actions or sidebar filters</text></g><g id="prefs"><rect class="node" x="300" y="535" width="600" height="110" rx="12"/><text x="600.0" y="565.0" class="heading">RETAIN AND REFINE PREFERENCES</text><text x="600.0" y="586.0" class="">Location · multiple types/categories · BHK · budget · size</text><text x="600.0" y="607.0" class="">Add / replace / cancel · auction opt-in</text><text x="600.0" y="628.0" class="">Keep selected property and own funds separate</text></g><g id="search"><rect class="node" x="65" y="710" width="330" height="110" rx="12"/><text x="230.0" y="740.0" class="heading">SEARCH AND VERIFY</text><text x="230.0" y="761.0" class="">Sales · projects · eligible auctions</text><text x="230.0" y="782.0" class="">CMDA approval references</text><text x="230.0" y="803.0" class="">Respect missing source details</text></g><g id="guide"><rect class="node" x="435" y="710" width="330" height="110" rx="12"/><text x="600.0" y="740.0" class="heading">GUIDANCE AND CALCULATIONS</text><text x="600.0" y="761.0" class="">Property details and source links</text><text x="600.0" y="782.0" class="">Area / price / EMI · official lenders</text><text x="600.0" y="803.0" class="">Ask one useful question if needed</text></g><g id="actions"><rect class="node" x="805" y="710" width="330" height="110" rx="12"/><text x="970.0" y="740.0" class="heading">CUSTOMER ACTIONS</text><text x="970.0" y="761.0" class="">Follow-up schedule + consent</text><text x="970.0" y="782.0" class="">Share feedback + category/comment</text><text x="970.0" y="803.0" class="">End chat + satisfaction rating</text></g><g id="results"><rect class="node" x="65" y="890" width="330" height="120" rx="12"/><text x="230.0" y="914.5" class="heading">SEARCH OUTCOME</text><text x="230.0" y="935.5" class="">All matches · five per page</text><text x="230.0" y="956.5" class="">Numbered pages and refinements</text><text x="230.0" y="977.5" class="">No match: name blocking preferences</text><text x="230.0" y="998.5" class="">Unknown details stay unverified</text></g><g id="answer"><rect class="node" x="435" y="890" width="330" height="120" rx="12"/><text x="600.0" y="914.5" class="heading">GROUNDED RESPONSE</text><text x="600.0" y="935.5" class="">Answer current intent in context</text><text x="600.0" y="956.5" class="">Prices and availability need checking</text><text x="600.0" y="977.5" class="">Provider failure: supported local flow</text><text x="600.0" y="998.5" class="">No invented facts or guarantees</text></g><g id="saved"><rect class="node" x="805" y="890" width="330" height="120" rx="12"/><text x="970.0" y="914.5" class="heading">SAVED ACTION OUTCOME</text><text x="970.0" y="935.5" class="">Follow-up saved popup after save</text><text x="970.0" y="956.5" class="">Feedback saved confirmation</text><text x="970.0" y="977.5" class="">Failure must not claim success</text><text x="970.0" y="998.5" class="">Saved email request is not sent mail</text></g><g id="storage"><rect class="node" x="300" y="1080" width="600" height="110" rx="12"/><text x="600.0" y="1110.0" class="heading">SHARED PERSISTENT RECORDS · SUPABASE</text><text x="600.0" y="1131.0" class="">Public app + localhost use the same configured database</text><text x="600.0" y="1152.0" class="">Conversations · feedback · learning approval decisions</text><text x="600.0" y="1173.0" class="">Redaction · stable IDs · no silent configured-DB fallback</text></g><g id="owner"><rect class="node" x="300" y="1250" width="600" height="110" rx="12"/><text x="600.0" y="1280.0" class="heading">PASSWORD-PROTECTED MIRA STUDIO</text><text x="600.0" y="1301.0" class="">Customer details · follow-ups · feedback · Quality Review</text><text x="600.0" y="1322.0" class="">Eight KPIs · date filters · reports and exports</text><text x="600.0" y="1343.0" class="">Shared snapshot dates use India time on Studio load</text></g><g id="draft"><rect class="node" x="300" y="1420" width="600" height="100" rx="12"/><text x="600.0" y="1445.0" class="heading">LEARNING LIBRARY · DRAFT</text><text x="600.0" y="1466.0" class="">Feedback and repeated quality cues link to evidence</text><text x="600.0" y="1487.0" class="">Refresh preserves existing review decisions</text><text x="600.0" y="1508.0" class="">Draft guidance is inactive</text></g><g id="decision"><rect class="node" x="300" y="1580" width="600" height="90" rx="12"/><text x="600.0" y="1610.5" class="heading">OWNER REVIEW AND DECISION</text><text x="600.0" y="1631.5" class="">Inspect the conversation · edit scenario and guidance</text><text x="600.0" y="1652.5" class="">Approve, reject or request an implementation fix</text></g><g id="reject"><rect class="node" x="65" y="1740" width="330" height="100" rx="12"/><text x="230.0" y="1765.0" class="heading">REJECT / REVISE</text><text x="230.0" y="1786.0" class="">Rejected drafts remain inactive</text><text x="230.0" y="1807.0" class="">Revise and review again</text><text x="230.0" y="1828.0" class="">Customer feedback is not auto-training</text></g><g id="approved"><rect class="node" x="435" y="1740" width="330" height="100" rx="12"/><text x="600.0" y="1765.0" class="heading">APPROVE GUIDANCE</text><text x="600.0" y="1786.0" class="">Approved rules only</text><text x="600.0" y="1807.0" class="">Bounded hosted reasoning guidance</text><text x="600.0" y="1828.0" class="">No model-weight retraining</text></g><g id="fix"><rect class="node" x="805" y="1740" width="330" height="100" rx="12"/><text x="970.0" y="1765.0" class="heading">IMPLEMENTATION FIX</text><text x="970.0" y="1786.0" class="">Change conversation / storage / UI code</text><text x="970.0" y="1807.0" class="">Keep deterministic safety checks</text><text x="970.0" y="1828.0" class="">Test the reported bug and regressions</text></g><g id="release"><rect class="node" x="300" y="1910" width="600" height="100" rx="12"/><text x="600.0" y="1935.0" class="heading">VALIDATE AND RELEASE</text><text x="600.0" y="1956.0" class="">Complete journeys · owner reports · performance</text><text x="600.0" y="1977.0" class="">Deploy · verify public behavior · review new outcomes</text><text x="600.0" y="1998.0" class="">New feedback starts the improvement loop</text></g></svg>